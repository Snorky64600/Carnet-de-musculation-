name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Build in clean isolated folder
        run: |
          # 1. Créer un projet propre
          flutter create clean_build --org com.cyril.muscu --project-name carnet_musculation --platforms=android
          
          # 2. Injecter ton code et config
          rm -rf clean_build/lib/main.dart
          cp -r lib/. clean_build/lib/
          cp pubspec.yaml clean_build/pubspec.yaml
          cp custom_build.gradle clean_build/android/app/build.gradle
          
          # 3. Générer la clé de signature directement depuis le secret GitHub
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > clean_build/android/app/upload-keystore.jks
          
          # 4. Créer le fichier key.properties automatiquement
          echo "storePassword=password" > clean_build/android/key.properties
          echo "keyPassword=password" >> clean_build/android/key.properties
          echo "keyAlias=upload" >> clean_build/android/key.properties
          echo "storeFile=upload-keystore.jks" >> clean_build/android/key.properties
          
          # 5. Compilation
          cd clean_build
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: clean_build/build/app/outputs/flutter-apk/app-release.apk
