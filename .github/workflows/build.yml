name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Create clean project and inject code
        run: |
          flutter create my_app --org com.cyril.muscu --project-name carnet_musculation --platforms=android
          cp lib/main.dart my_app/lib/main.dart
          cp pubspec.yaml my_app/pubspec.yaml
          cd my_app
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: my_app/build/app/outputs/flutter-apk/app-release.apk
          
