name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Sauvegarder code et config, générer Android, puis restaurer
        run: |
          mkdir -p safety_backup
          cp lib/main.dart safety_backup/main.dart
          cp pubspec.yaml safety_backup/pubspec.yaml
          
          flutter create . --org com.cyril.muscu --project-name carnet_musculation --platforms=android --overwrite
          
          cp safety_backup/main.dart lib/main.dart
          cp safety_backup/pubspec.yaml pubspec.yaml
          
      - name: Installation des dépendances et compilation APK
        run: |
          flutter pub get
          flutter build apk --release
          
      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
