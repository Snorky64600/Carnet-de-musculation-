name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          
      - name: Build Flutter APK safely
        run: |
          # Créer un projet Flutter propre
          flutter create carnet_app --org com.cyril.muscu --platforms=android
          
          # Injecter ton code et ta configuration s'ils existent
          if [ -f "lib/main.dart" ]; then
            cp lib/main.dart carnet_app/lib/main.dart
          fi
          
          if [ -f "pubspec.yaml" ]; then
            cp pubspec.yaml carnet_app/pubspec.yaml
          fi
          
          # Compiler à l'intérieur du projet propre
          cd carnet_app
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: carnet_app/build/app/outputs/flutter-apk/app-release.apk
          
