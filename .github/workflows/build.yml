name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Build in clean isolated folder
        run: |
          # 1. Créer un projet propre dans un sous-dossier
          flutter create clean_build --org com.cyril.muscu --project-name carnet_musculation --platforms=android
          
          # 2. Injecter ton code et ta configuration dedans
          rm -rf clean_build/lib/main.dart
          cp -r lib/. clean_build/lib/
          cp pubspec.yaml clean_build/pubspec.yaml
          
          # 3. Se placer dans le dossier, installer et compiler
          cd clean_build
          flutter pub get
          flutter build apk --release
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: clean_build/build/app/outputs/flutter-apk/app-release.apk
          
