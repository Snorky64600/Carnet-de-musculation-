name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.19.6'
        channel: 'stable'
        cache: true

    - name: Install Dependencies
      run: flutter pub get

    - name: Create Clean Build Folder
      run: flutter create clean_build --org com.cyril.muscu --project-name carnet_musculation

    - name: Copy project files and signature into clean_build
      run: |
        rm -rf clean_build/lib
        cp -r lib clean_build/lib
        if [ -d "assets" ]; then cp -r assets clean_build/assets; fi
        cp pubspec.yaml clean_build/pubspec.yaml
        
        # Copie les fichiers de signature pour que l'APK soit signé avec ta vraie clé
        if [ -f "key.properties" ]; then cp key.properties clean_build/android/; fi
        if [ -f "upload-keystore.jks" ]; then cp upload-keystore.jks clean_build/android/app/; fi
        if [ -f "android/key.properties" ]; then cp android/key.properties clean_build/android/; fi
        if [ -f "android/app/upload-keystore.jks" ]; then cp android/app/upload-keystore.jks clean_build/android/app/; fi

    - name: Run Android Patch Script
      run: python3 patch_android.py

    - name: Build APK Release
      run: |
        cd clean_build
        flutter pub get
        flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: clean_build/build/app/outputs/flutter-apk/app-release.apk
