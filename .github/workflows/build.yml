name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          
      - name: Accept Android licenses
        run: yes "y" | flutter doctor --android-licenses || true
          
      - name: Build Flutter APK safely
        run: |
          flutter create carnet_app --org com.cyril.muscu --platforms=android --project-name carnet_musculation
          rm -f carnet_app/lib/main.dart
          cp lib/main.dart carnet_app/lib/main.dart
          cp pubspec.yaml carnet_app/pubspec.yaml
          cd carnet_app
          flutter pub get
          flutter build apk --release --verbose
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: carnet_app/build/app/outputs/flutter-apk/app-release.apk
          
